<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Una lista sencilla para organizar tus tareas.">
    <title>Tareas claras</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <header class="intro">
        <p class="eyebrow">UN PASO A LA VEZ</p>
        <h1>Tareas claras</h1>
        <p class="subtitle">Anota lo importante. Lo demás puede esperar.</p>
      </header>

      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-title">Nueva tarea</label>
        <input id="task-title" name="title" maxlength="120" placeholder="¿Qué necesitas hacer?" required>
        <button type="submit">Agregar</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <section aria-labelledby="list-heading">
        <div class="list-heading">
          <h2 id="list-heading">Tu lista</h2>
          <span id="task-count" class="count">0 tareas</span>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state">Todavía no hay tareas. Agrega la primera.</p>
      </section>
      <footer><span>API:</span> <a href="/healthz">salud</a> · <a href="/metrics">métricas</a></footer>
    </main>
  </body>
</html>
