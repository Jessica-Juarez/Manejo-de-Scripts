name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  release-check:
    name: Construir y comprobar imagen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar entorno de liberación
        run: bash scripts/setup-release.sh
      - name: Validar configuración Docker Compose
        run: docker compose config --quiet
      - name: Iniciar imagen y comprobar salud
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build
          trap 'docker compose down' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              echo
              echo "Imagen validada correctamente."
              exit 0
            fi
            sleep 1
          done
          docker compose logs --tail=80
          exit 1

  deploy:
    name: Solicitar despliegue en Render
    needs: release-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Solicitar despliegue del commit validado
        run: bash scripts/deploy-render.sh
